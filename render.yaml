services:
  # ─── Backend API Web Service ──────────────────────────────────────────────
  - type: web
    name: royalsync-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # ─── Frontend Web Portal (Static Site) ───────────────────────────────────
  - type: web
    name: royalsync-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: royalsync-api
          property: host
